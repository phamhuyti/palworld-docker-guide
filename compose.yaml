# Đây là bản compose.yaml THẬT đang chạy trên NAS của tôi (nhánh `nas-deployment`),
# khác với nhánh `main` (bản template chung dùng bind 127.0.0.1 cho người khác đọc
# theo hướng dẫn). IP LAN dưới đây (192.168.1.160) là địa chỉ nội bộ mạng nhà tôi —
# chỉ truy cập được trong LAN/VPN, không có ý nghĩa gì nếu đứng ngoài mạng đó.
services:
  palworld-server:
    image: ghcr.io/pocketpairjp/palserver:latest
    container_name: palworld-server
    restart: unless-stopped
    stop_grace_period: 30s
    entrypoint: /pal/helper.sh
    command:
      - "-port=8211"
      - "-useperfthreads"
      - "-NoAsyncLoadingThread"
      - "-UseMultithreadForDS"
      # - "-publiclobby"
    ports:
      - "192.168.1.160:8211:8211/udp"
      - "192.168.1.160:25575:25575/tcp"   # RCON — chỉ LAN truy cập được, không lộ ra Internet
      - "192.168.1.160:8212:8212/tcp"     # REST API — chỉ LAN truy cập được, không lộ ra Internet
    volumes:
      - ./helper.sh:/pal/helper.sh:ro
      - ./Saved:/pal/Package/Pal/Saved

  # Bảng điều khiển quản trị (PWA). Vào VPN rồi mở http://192.168.1.160:8080
  # Yêu cầu server bật RESTAPIEnabled=True (và RCONEnabled=True cho RCON console).
  # Mật khẩu lấy từ file .env cạnh compose (PAL_ADMIN_PASSWORD).
  palworld-admin:
    image: python:3.12-slim
    container_name: palworld-admin
    restart: unless-stopped
    depends_on:
      - palworld-server
    environment:
      PAL_HOST: palworld-server      # gọi tới server qua tên service (mạng nội bộ compose)
      PAL_REST_PORT: "8212"
      PAL_RCON_PORT: "25575"
      PAL_BIND: "0.0.0.0"            # bind mọi interface trong container; host chỉ mở ở IP LAN bên dưới
      PAL_WEB_PORT: "8080"
      PAL_ADMIN_PASSWORD: ${PAL_ADMIN_PASSWORD}   # AdminPassword server (REST/RCON)
      PAL_APP_PASSWORD: ${PAL_ADMIN_PASSWORD}     # mật khẩu đăng nhập app (dùng chung theo lựa chọn)
      PAL_CONFIG_PATH: "/pal/Config/LinuxServer/PalWorldSettings.ini"
    volumes:
      - ./admin-tool.py:/app/admin-tool.py:ro
      - ./Saved/Config/LinuxServer:/pal/Config/LinuxServer   # đọc/ghi PalWorldSettings.ini trực tiếp qua trang /config
    command: ["python", "/app/admin-tool.py"]
    ports:
      - "192.168.1.160:8080:8080/tcp"   # chỉ LAN/VPN — KHÔNG port-forward ra Internet

  # Trình sửa save file (Palworld Save Pal — fork phamhuyti/palworld-save-pal,
  # clone tại /volume4/docker/palworld-save-pal). Vào VPN rồi mở
  # http://192.168.1.160:5174 — KHÔNG có đăng nhập, chỉ bảo vệ bằng LAN/VPN.
  # UI tự liệt kê world trong PSP_SAVES_DIR ("Server saves") — bấm chọn là load.
  # LƯU Ý: dừng palworld-server trước khi ghi save để tránh xung đột file.
  palworld-savepal:
    build:
      context: ../palworld-save-pal
      dockerfile: Dockerfile
      args:
        # host:port mà TRÌNH DUYỆT dùng để kết nối WebSocket về server này
        - PUBLIC_WS_URL=192.168.1.160:5174/ws
    container_name: palworld-savepal
    restart: unless-stopped
    environment:
      PSP_SAVES_DIR: /saves            # UI tự liệt kê world trong đây để chọn, khỏi upload
    volumes:
      - ./savepal-db:/app/db            # DB cài đặt/preset của Save Pal
      - ./Saved/SaveGames:/saves        # save world thật — Save Pal đọc/ghi trực tiếp
    ports:
      - "192.168.1.160:5174:5174/tcp"   # chỉ LAN/VPN — KHÔNG port-forward ra Internet
